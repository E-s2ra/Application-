services:
  # -------------------------------------------------------------
  # Dedicated PostgreSQL Database Service
  # -------------------------------------------------------------
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: aniflix-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aniflix-network

  # -------------------------------------------------------------
  # PostgREST Data API Layer (Internal)
  # -------------------------------------------------------------
  postgrest:
    image: public.ecr.aws/supabase/postgrest:v16.1
    container_name: aniflix-postgrest-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_SERVER_PORT: 3000
    expose:
      - "3000"
    networks:
      - aniflix-network

  # -------------------------------------------------------------
  # GoTrue Auth API Layer (Internal)
  # -------------------------------------------------------------
  gotrue:
    image: supabase/gotrue:v2.132.3
    container_name: aniflix-gotrue-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54324
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?search_path=auth,public
      GOTRUE_SITE_URL: http://localhost:8081
      GOTRUE_URI_ALLOW_LIST: http://localhost:8081/*,http://127.0.0.1:8081/*,http://localhost:8081,http://127.0.0.1:8081
      GOTRUE_JWT_SECRET: ${PGRST_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ""
    expose:
      - "9999"
    networks:
      - aniflix-network

  # -------------------------------------------------------------
  # CORS Gateway Proxy (Port 54324 -> PostgREST 3000)
  # Resolves all CORS preflight, Authorization headers, and /rest/v1 routes
  # -------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: aniflix-cors-proxy
    restart: unless-stopped
    depends_on:
      - postgrest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "54324:54324"
    networks:
      - aniflix-network

volumes:
  postgres_data:
    name: aniflix_postgres_data
    driver: local

networks:
  aniflix-network:
    name: aniflix_network
    driver: bridge
