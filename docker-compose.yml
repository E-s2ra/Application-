services:
  # -------------------------------------------------------------
  # Dedicated PostgreSQL Database Service
  # -------------------------------------------------------------
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: aniflix-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aniflix-network

  # -------------------------------------------------------------
  # PostgREST Data API Layer
  # -------------------------------------------------------------
  postgrest:
    image: public.ecr.aws/supabase/postgrest:v16.1
    container_name: aniflix-postgrest-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_SERVER_PORT: 3000
    ports:
      - "${POSTGREST_PORT:-54324}:3000"
    networks:
      - aniflix-network

  # -------------------------------------------------------------
  # Frontend Web Application Container
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aniflix-web-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-local-anon-key}
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - aniflix-network

volumes:
  postgres_data:
    name: aniflix_postgres_data
    driver: local

networks:
  aniflix-network:
    name: aniflix_network
    driver: bridge
